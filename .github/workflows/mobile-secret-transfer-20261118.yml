name: One-time mobile Telegram secret transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt existing Telegram secrets for the mobile repository
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          python -m pip install --disable-pip-version-check --quiet --target "$RUNNER_TEMP/mobile-secret-crypto" PyNaCl==1.6.2
          PYTHONPATH="$RUNNER_TEMP/mobile-secret-crypto" python - <<'PY'
          import base64
          import json
          import os
          from nacl.public import PublicKey, SealedBox
          names = ("TELEGRAM_TOKEN", "TELEGRAM_TO")
          if not all(os.environ.get(name) for name in names):
              raise SystemExit("Required source repository secrets are missing")
          box = SealedBox(PublicKey(base64.b64decode("E/tPS7No88RMMfzauGDYLTM8/vSr8+sGZDCxBDrYNDc=")))
          payload = {"key_id": "3380204578043523366", "secrets": {
              name: base64.b64encode(box.encrypt(os.environ[name].encode())).decode()
              for name in names}}
          with open("encrypted-telegram.json", "w", encoding="utf-8") as out:
              json.dump(payload, out)
          print("Encrypted two secrets for hbq0405/etkn-mobile; no plaintext exported")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-telegram-encrypted
          path: encrypted-telegram.json
          retention-days: 1
